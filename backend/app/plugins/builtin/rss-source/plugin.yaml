name: rss-source
version: 1.0.0
type: source
entry_point: main:RssSourcePlugin
description: "Fetches articles from an RSS/Atom feed and injects them as documents for ontology enrichment."
author: "MiroFish"
config_schema:
  type: object
  properties:
    feed_url:
      type: string
      description: "URL of the RSS or Atom feed to fetch."
    max_items:
      type: integer
      description: "Maximum number of articles to fetch (default: 10)."
      default: 10
  required:
    - feed_url
